<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260">
  <defs>
    <linearGradient id="v3ChevronL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="v3ChevronR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="v3ApexSpeed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="v3GoldBurst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- VARIANT 3 MARK: THE KINETIC SPRINT VECTOR -->
  <g transform="translate(130, 130)">
    <!-- Outer Inverted Dynamic Chevron Left -->
    <path d="M-72,-65 L-40,-65 L-12,32 C-7,48 -20,62 -36,62 L-54,62 C-70,62 -78,48 -82,32 Z" fill="url(#v3ChevronL)"/>
    
    <!-- Outer Inverted Dynamic Chevron Right -->
    <path d="M72,-65 L40,-65 L12,32 C7,48 20,62 36,62 L54,62 C70,62 78,48 82,32 Z" fill="url(#v3ChevronR)"/>

    <!-- Central High-Velocity Penetrator Core (72H / 5-Day Sprint Arrow) -->
    <polygon points="0,-72 24,-16 10,-16 18,36 0,68 -18,36 -10,-16 -24,-16" fill="url(#v3ApexSpeed)"/>

    <!-- Kinetic Energy Acceleration Blade -->
    <polygon points="0,-52 12,-16 0,22 -12,-16" fill="#FFFFFF" opacity="0.95"/>

    <!-- Base Acceleration Thrusters -->
    <polygon points="-24,42 -4,64 -18,64" fill="url(#v3GoldBurst)"/>
    <polygon points="24,42 4,64 18,64" fill="url(#v3GoldBurst)"/>
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g transform="translate(255, 0)">
    <text x="0" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" font-style="italic" fill="#F8FAFC" letter-spacing="1">UNAGENCY</text>
    <text x="316" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="400" font-style="italic" fill="#38BDF8" letter-spacing="2">STUDIO</text>
    
    <!-- Subtitle: Deterministic Sprints -->
    <text x="2" y="142" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#F59E0B" letter-spacing="5">HIGH-VELOCITY SPRINTS · 72H TO PRODUCTION</text>
    
    <!-- Meta Badges -->
    <g transform="translate(2, 166)">
      <rect x="0" y="0" width="154" height="24" rx="4" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
      <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#F59E0B" letter-spacing="1">72-HOUR VELOCITY</text>

      <rect x="164" y="0" width="144" height="24" rx="4" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="176" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1">5-DAY RAPID MVP</text>

      <rect x="318" y="0" width="152" height="24" rx="4" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <text x="330" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#10B981" letter-spacing="1">100% LIGHTHOUSE</text>
    </g>
  </g>
</svg>

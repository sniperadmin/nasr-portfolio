<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260">
  <defs>
    <linearGradient id="v1CoreGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="v1BeaconLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- VARIANT 1 MARK: THE AUTONOMOUS POD MESH (LIGHT) -->
  <g transform="translate(130, 130)">
    <!-- Connectivity Web -->
    <path d="M-60,-50 L0,-15 L60,-50 M-60,-50 L-60,30 L0,65 L60,30 L60,-50 M0,-15 L0,65" stroke="rgba(2, 132, 199, 0.35)" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    
    <!-- Left Pod Tower -->
    <g transform="translate(-60, -50)">
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#F1F5F9" stroke="#0284C7" stroke-width="2.5"/>
      <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="url(#v1CoreGradLight)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Left Intermediate Pillar -->
    <g transform="translate(-60, 30)">
      <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" fill="#E2E8F0" stroke="#2563EB" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#0284C7"/>
    </g>

    <!-- Bottom Nexus Node -->
    <g transform="translate(0, 65)">
      <polygon points="0,-28 26,-14 26,16 0,30 -26,16 -26,-14" fill="#FFFFFF" stroke="#059669" stroke-width="2.5"/>
      <polygon points="0,-28 26,-14 0,-1 -26,-14" fill="#E0F2FE"/>
      <polygon points="-26,-14 0,-1 0,30 -26,16" fill="url(#v1CoreGradLight)"/>
      <polygon points="0,-1 26,-14 26,16 0,30" fill="url(#v1BeaconLight)"/>
      <polygon points="0,-6 6,0 0,6 -6,0" fill="#FFFFFF"/>
    </g>

    <!-- Right Intermediate Pillar -->
    <g transform="translate(60, 30)">
      <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" fill="#E2E8F0" stroke="#2563EB" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#0284C7"/>
    </g>

    <!-- Right Pod Tower -->
    <g transform="translate(60, -50)">
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#F1F5F9" stroke="#0284C7" stroke-width="2.5"/>
      <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="url(#v1CoreGradLight)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Central Floating Data Core -->
    <g transform="translate(0, -15)">
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#059669"/>
    </g>
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g transform="translate(255, 0)">
    <text x="0" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#0F172A" letter-spacing="1.5">UNAGENCY</text>
    <text x="306" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="400" fill="#0284C7" letter-spacing="2">STUDIO</text>
    
    <text x="2" y="142" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#047857" letter-spacing="5">AUTONOMOUS AGENT PODS · ZERO BLOAT</text>
    
    <g transform="translate(2, 166)">
      <rect x="0" y="0" width="138" height="24" rx="4" fill="rgba(2, 132, 199, 0.08)" stroke="rgba(2, 132, 199, 0.25)" stroke-width="1"/>
      <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#0369A1" letter-spacing="1">14 PODS MESH</text>

      <rect x="148" y="0" width="144" height="24" rx="4" fill="rgba(4, 120, 87, 0.08)" stroke="rgba(4, 120, 87, 0.25)" stroke-width="1"/>
      <text x="160" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#047857" letter-spacing="1">STAGE-GATE DoD</text>

      <rect x="302" y="0" width="168" height="24" rx="4" fill="rgba(217, 119, 6, 0.08)" stroke="rgba(217, 119, 6, 0.25)" stroke-width="1"/>
      <text x="314" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#B45309" letter-spacing="1">72H DETERMINISTIC</text>
    </g>
  </g>
</svg>

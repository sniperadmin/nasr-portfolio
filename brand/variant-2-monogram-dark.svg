<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260">
  <defs>
    <linearGradient id="v2BracketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="v2PillarL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="v2PillarR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- VARIANT 2 MARK: THE SOVEREIGN STAGE-GATE MONOGRAM [un] -->
  <g transform="translate(130, 130)">
    <!-- Outer Code Bracket Left: [ -->
    <path d="M-64,-68 L-84,-68 L-84,68 L-64,68" stroke="url(#v2BracketGrad)" stroke-width="7" stroke-linecap="square" fill="none"/>
    
    <!-- Outer Code Bracket Right: ] -->
    <path d="M64,-68 L84,-68 L84,68 L64,68" stroke="url(#v2BracketGrad)" stroke-width="7" stroke-linecap="square" fill="none"/>

    <!-- Left Pillar (Stage 1 Design Council & Architecture) -->
    <path d="M-50,-48 L-22,-48 L-22,24 C-22,42 -34,48 -46,48 L-50,48 Z" fill="url(#v2PillarL)"/>

    <!-- Gateway Arch / Stage-Gate Threshold Connector -->
    <path d="M-22,8 L22,8 L22,34 L-22,34 Z" fill="rgba(56, 189, 248, 0.25)" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="0" cy="21" r="5" fill="#38BDF8"/>

    <!-- Right Pillar (Stage 3 Dev & Reality QA Gate) -->
    <path d="M50,-48 L22,-48 L22,24 C22,42 34,48 46,48 L50,48 Z" fill="url(#v2PillarR)"/>

    <!-- Luminous Central Spark (Zero Meeting Autonomous Intelligence) -->
    <polygon points="0,-36 6,-20 22,-20 9,-9 14,7 0,-2 -14,7 -9,-9 -22,-20 -6,-20" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g transform="translate(255, 0)">
    <!-- [un] Bracketed Wordmark -->
    <text x="0" y="100" font-family="'JetBrains Mono', monospace" font-size="44" font-weight="800" fill="#38BDF8" letter-spacing="-1">[</text>
    <text x="24" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#F8FAFC" letter-spacing="1">un</text>
    <text x="76" y="100" font-family="'JetBrains Mono', monospace" font-size="44" font-weight="800" fill="#38BDF8" letter-spacing="-1">]</text>
    <text x="104" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#F8FAFC" letter-spacing="1.5">AGENCY</text>
    <text x="312" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="300" fill="#10B981" letter-spacing="2">STUDIO</text>
    
    <!-- Subtitle: Anti-Agency Execution -->
    <text x="2" y="142" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#38BDF8" letter-spacing="5">THE ANTI-AGENCY · NO MEETINGS. JUST SHIPPED CODE.</text>
    
    <!-- Meta Badges -->
    <g transform="translate(2, 166)">
      <rect x="0" y="0" width="148" height="24" rx="4" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1">100% CODE-NATIVE</text>

      <rect x="158" y="0" width="154" height="24" rx="4" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <text x="170" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#10B981" letter-spacing="1">SANDBOX ISOLATED</text>

      <rect x="322" y="0" width="148" height="24" rx="4" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
      <text x="334" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#F59E0B" letter-spacing="1">ZERO HOURLY TRAP</text>
    </g>
  </g>
</svg>

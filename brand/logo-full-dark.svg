<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260">
  <defs>
    <linearGradient id="v1CoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="v1Beacon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="v1PodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="v1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- BACKGROUND IS TRANSPARENT -->

  <!-- VARIANT 1 MARK: THE AUTONOMOUS POD MESH (Isometric "U" Nexus) -->
  <g transform="translate(130, 130)">
    <!-- Ambient Pod Connectivity Web -->
    <path d="M-60,-50 L0,-15 L60,-50 M-60,-50 L-60,30 L0,65 L60,30 L60,-50 M0,-15 L0,65" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    
    <!-- Left Pod Tower (Dev & Architecture Pod) -->
    <g transform="translate(-60, -50)">
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
      <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="url(#v1CoreGrad)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Left Intermediate Pillar -->
    <g transform="translate(-60, 30)">
      <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#38BDF8"/>
    </g>

    <!-- Bottom Nexus Node (Executive & Stage-Gate Orchestrator) -->
    <g transform="translate(0, 65)">
      <!-- Isometric Base Cube -->
      <polygon points="0,-28 26,-14 26,16 0,30 -26,16 -26,-14" fill="#0A0F1D" stroke="#10B981" stroke-width="2.5"/>
      <!-- Top Face -->
      <polygon points="0,-28 26,-14 0,-1 -26,-14" fill="#132438"/>
      <!-- Left Face -->
      <polygon points="-26,-14 0,-1 0,30 -26,16" fill="url(#v1CoreGrad)"/>
      <!-- Right Face -->
      <polygon points="0,-1 26,-14 26,16 0,30" fill="url(#v1Beacon)"/>
      <!-- Heartbeat Diamond -->
      <polygon points="0,-6 6,0 0,6 -6,0" fill="#FFFFFF" filter="url(#v1Glow)"/>
    </g>

    <!-- Right Intermediate Pillar -->
    <g transform="translate(60, 30)">
      <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#38BDF8"/>
    </g>

    <!-- Right Pod Tower (Commerce & Growth Pod) -->
    <g transform="translate(60, -50)">
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
      <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="url(#v1CoreGrad)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Central Floating Data Core -->
    <g transform="translate(0, -15)">
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#1E293B" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#10B981"/>
    </g>
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g transform="translate(255, 0)">
    <text x="0" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#F8FAFC" letter-spacing="1.5">UNAGENCY</text>
    <text x="306" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="300" fill="#38BDF8" letter-spacing="2">STUDIO</text>
    
    <!-- Subtitle: Autonomous Pod Mesh -->
    <text x="2" y="142" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#10B981" letter-spacing="5">AUTONOMOUS AGENT PODS · ZERO BLOAT</text>
    
    <!-- Meta Telemetry Badges -->
    <g transform="translate(2, 166)">
      <rect x="0" y="0" width="138" height="24" rx="4" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1">14 PODS MESH</text>

      <rect x="148" y="0" width="144" height="24" rx="4" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <text x="160" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#10B981" letter-spacing="1">STAGE-GATE DoD</text>

      <rect x="302" y="0" width="168" height="24" rx="4" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
      <text x="314" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#F59E0B" letter-spacing="1">72H DETERMINISTIC</text>
    </g>
  </g>
</svg>

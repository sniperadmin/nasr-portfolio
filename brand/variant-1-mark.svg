<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="v1MarkCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="v1MarkBeacon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <g transform="translate(100, 100)">
    <!-- Connectivity Web -->
    <path d="M-60,-50 L0,-15 L60,-50 M-60,-50 L-60,30 L0,65 L60,30 L60,-50 M0,-15 L0,65" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2.5" stroke-dasharray="4 4" fill="none"/>
    
    <!-- Left Pod Tower -->
    <g transform="translate(-60, -50)">
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
      <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="url(#v1MarkCore)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Left Intermediate Pillar -->
    <g transform="translate(-60, 30)">
      <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#38BDF8"/>
    </g>

    <!-- Bottom Nexus Node -->
    <g transform="translate(0, 65)">
      <polygon points="0,-28 26,-14 26,16 0,30 -26,16 -26,-14" fill="#0A0F1D" stroke="#10B981" stroke-width="2.5"/>
      <polygon points="0,-28 26,-14 0,-1 -26,-14" fill="#132438"/>
      <polygon points="-26,-14 0,-1 0,30 -26,16" fill="url(#v1MarkCore)"/>
      <polygon points="0,-1 26,-14 26,16 0,30" fill="url(#v1MarkBeacon)"/>
      <polygon points="0,-6 6,0 0,6 -6,0" fill="#FFFFFF"/>
    </g>

    <!-- Right Intermediate Pillar -->
    <g transform="translate(60, 30)">
      <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#38BDF8"/>
    </g>

    <!-- Right Pod Tower -->
    <g transform="translate(60, -50)">
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
      <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="url(#v1MarkCore)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Central Floating Data Core -->
    <g transform="translate(0, -15)">
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#1E293B" stroke="rgba(56, 189, 248, 0.7)" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="#10B981"/>
    </g>
  </g>
</svg>
